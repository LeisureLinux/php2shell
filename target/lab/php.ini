; Lab configuration for both CVEs.
;
; Every "required" line below is load-bearing for one of the two chains --
; they are not tuning knobs.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 8M
post_max_size = 64M
upload_max_filesize = 64M

; ---------------------------------------------------------------------------
; CVE-2026-109618 stage 1 needs PS(send_cookie) to survive a failed
; php_session_send_cookie().  That function only fails when headers have
; already been sent.  Warnings emitted during php_request_startup() go through
; php_printf -> php_output_write, which writes to the output buffer WITHOUT
; setting SG(headers_sent).  Turning buffering off is what makes the warning
; really count as "headers sent".
;
; Side effect: the reader for CVE-2026-109619 then cannot call
; session_start() ("headers already sent"), so apache.conf re-enables
; buffering for that directory only.
; ---------------------------------------------------------------------------
output_buffering = Off
implicit_flush = On

; ---------------------------------------------------------------------------
; session
; ---------------------------------------------------------------------------
session.save_path = "/tmp"
; Off, and bootstrap.php opens the session itself: the gadget class must
; exist before the session is read, otherwise the injected object becomes
; __PHP_Incomplete_Class and never gets a __destruct call.
session.auto_start = Off
session.use_strict_mode = 0
session.use_cookies = 1
session.cookie_lifetime = 0
; The writer for CVE-2026-109619: stores session variable NAMES verbatim.
session.serialize_handler = php

; ---------------------------------------------------------------------------
; upload_progress -- this is how the attacker picks a session variable NAME
; ---------------------------------------------------------------------------
session.upload_progress.enabled = On
; *** THE TWO CHAINS NEED OPPOSITE VALUES ***
;
;   Off -> the progress entry (whose NAME is the payload) is still there when
;          the session is written to disk.        [CVE-2026-109619 writer]
;
;   On  -> the END event calls php_session_rfc1867_cleanup() ->
;          php_session_initialize() -> php_session_reset_id(), which is what
;          emits the Set-Cookie that leaks the dangling PS(id).
;                                                  [CVE-2026-109618 stage 1]
;
; 01_setup_lab.sh takes the chain number as its 3rd argument and flips this
; line for you.
session.upload_progress.cleanup = Off
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS
; Empty prefix so the variable name is exactly the attacker's bytes.
session.upload_progress.prefix = ""

; ---------------------------------------------------------------------------
; CVE-2026-109618 stage 1 relies on this warning firing at 1001 fields.
; Raising it removes the primitive.
; ---------------------------------------------------------------------------
max_input_vars = 1000
