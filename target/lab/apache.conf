Listen @PORT@
ServerName localhost

# Single worker on purpose.  CVE-2026-109619 needs the write request and the
# read request to hit the same PHP process; CVE-2026-109618 needs A to be the
# first request a worker handles, so the heap layout is deterministic.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    MaxRequestWorkers 1
    ServerLimit 1
    MaxConnectionsPerChild 0
</IfModule>

KeepAlive Off
DirectoryIndex index.php

# Application code lives OUTSIDE the webroot, like a real deployment's
# vendor/ directory.  The public webroot stays empty.
Alias /handler.php @APP@/handler.php
Alias /serialized/ @APP@/serialized/

<Directory @APP@>
    Require all granted
</Directory>

<Directory @APP@/serialized>
    Require all granted
    # The advisory's "a request to a directory using php_serialize"
    php_value session.serialize_handler php_serialize

    # CVE-2026-109618 needs output_buffering=Off globally so that the startup
    # warning really sets SG(headers_sent) -- otherwise PS(send_cookie) is
    # cleared normally and stage 1 has no dangling PS(id).
    # But that also makes headers_sent=1 here, and session_start() then fails
    # with "Session cannot be started after headers have already been sent".
    # So the reader turns buffering back on, just for this directory.
    php_value output_buffering 4096
    php_value implicit_flush 0

    # Load the gadget class BEFORE the session is read, otherwise the object
    # becomes __PHP_Incomplete_Class and never gets a __destruct call.
    php_admin_value auto_prepend_file @APP@/gadget.php
</Directory>

# Every request without a matching file still reaches PHP.  Without this,
# Apache answers its own 404 and PHP never runs.
FallbackResource /handler.php

# The public webroot: COMPLETELY EMPTY.
DocumentRoot @WEBROOT@
<Directory @WEBROOT@>
    Require all granted
</Directory>
